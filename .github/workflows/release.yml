name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Verify tag matches Cargo.toml version
        if: github.ref_type == 'tag'
        run: |
          cargo metadata --no-deps --format-version 1 | python3 -c '
          import json, os, sys
          tag = os.environ["GITHUB_REF_NAME"]
          expected = tag.removeprefix("v")
          pkgs = json.load(sys.stdin)["packages"]
          mismatches = [(p["name"], p["version"]) for p in pkgs if p["version"] != expected]
          if mismatches:
              for name, ver in mismatches:
                  print(f"Tag {tag} does not match {name} version {ver}", file=sys.stderr)
              sys.exit(1)
          '
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked --all-features
      - name: Check crate packaging metadata
        run: |
          # Inline patch lets cargo package resolve unpublished workspace crates
          # without adding [patch.crates-io] to .cargo/config.toml.
          cargo package --workspace --no-verify --locked \
            --config 'patch.crates-io.dwhy-core.path="crates/dwhy-core"' \
            --config 'patch.crates-io.dwhy-tui.path="crates/dwhy-tui"'

  build:
    name: build (${{ matrix.target }})
    needs: validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            file_arch: x86-64
            qemu: false
            extra_rustflags: ""
          - target: aarch64-unknown-linux-musl
            file_arch: ARM aarch64
            qemu: true
            extra_rustflags: "-C linker-flavor=ld.lld -C link-self-contained=yes -C target-feature=+crt-static"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo build --locked --release --target ${{ matrix.target }} -p dwhy-cli -p dwhy-mcp
        env:
          # Clean build with no cache for published release artifacts.
          # The workflow-level RUSTFLAGS overrides .cargo/config.toml's
          # [target.*.rustflags] (linker = "rust-lld" still comes from config),
          # so the musl target flags are repeated here.
          RUSTFLAGS: -D warnings ${{ matrix.extra_rustflags }}
      - name: Check the binaries are static and run
        env:
          TARGET: ${{ matrix.target }}
          FILE_ARCH: ${{ matrix.file_arch }}
          QEMU: ${{ matrix.qemu }}
        run: |
          bin="target/$TARGET/release/dwhy"
          mcp_bin="target/$TARGET/release/dwhy-mcp"
          for b in "$bin" "$mcp_bin"; do
            file "$b"
            file "$b" | grep -F "$FILE_ARCH"
            # aarch64-musl links non-PIE, so `file` says "statically linked";
            # x86_64-musl says "static-pie linked".
            file "$b" | grep -Eq 'static(-pie)? linked|statically linked'
          done
          if [ "$QEMU" = "true" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends qemu-user
            run=qemu-aarch64
          else
            run=
          fi
          DOCKER_HOST=unix:///nonexistent $run "$bin" --version
          DOCKER_HOST=unix:///nonexistent $run "$bin" doctor
          DOCKER_HOST=unix:///nonexistent $run "$bin" scan . --json -q --detectors cargo-target > /dev/null
          DOCKER_HOST=unix:///nonexistent $run "$mcp_bin" --version
          DOCKER_HOST=unix:///nonexistent $run "$mcp_bin" --help > /dev/null
      - name: Package tarball
        env:
          TARGET: ${{ matrix.target }}
        run: |
          bin="target/$TARGET/release/dwhy"
          mcp_bin="target/$TARGET/release/dwhy-mcp"
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            version="${GITHUB_REF_NAME}"
          else
            pkg_version=$(cargo metadata --no-deps --format-version 1 | python3 -c 'import json, sys; d = json.load(sys.stdin); print(next(p["version"] for p in d["packages"] if p["name"] == "dwhy-cli"))')
            version="v${pkg_version}-dryrun"
          fi
          staging="staging/dwhy-${version}-${TARGET}"
          mkdir -p "$staging/skills/diskwhy" dist
          install -m 0755 "$bin" "$staging/dwhy"
          install -m 0755 "$mcp_bin" "$staging/dwhy-mcp"
          cp skills/diskwhy/SKILL.md "$staging/skills/diskwhy/"
          cp README.md "$staging/"
          shopt -s nullglob
          for f in LICENSE*; do
            cp "$f" "$staging/"
          done
          source_date_epoch=$(git log -1 --format=%ct)
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime="@${source_date_epoch}" \
            -C staging -cf - "dwhy-${version}-${TARGET}" | gzip -n > "dist/dwhy-${version}-${TARGET}.tar.gz"
          echo "PACKAGE=dist/dwhy-${version}-${TARGET}.tar.gz" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: ${{ env.PACKAGE }}
          if-no-files-found: error

  release:
    name: release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd dist
          shopt -s nullglob
          files=(dwhy-*.tar.gz)
          if [ "${#files[@]}" -ne 2 ]; then
            echo "Expected 2 release tarballs, found ${#files[@]}" >&2
            exit 1
          fi
          LC_ALL=C sha256sum "${files[@]}" > SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: release-checksums
          path: dist/SHA256SUMS
          if-no-files-found: error
      - name: Create draft GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          extra=(--draft)
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            extra+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" dist/dwhy-*.tar.gz dist/SHA256SUMS \
            --verify-tag --generate-notes "${extra[@]}"
