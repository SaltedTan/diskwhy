[package]
name = "dwhy-mcp"
description = "diskwhy MCP server: scan, explain, diff, watch, plan and apply over stdio for agent clients without a shell"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "dwhy-mcp"
path = "src/main.rs"

[dependencies]
dwhy-core.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
rmcp = { version = "3.11", default-features = false, features = ["server", "macros", "transport-io"] }
# The version rmcp's tool schemas use.
schemars = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std"] }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
