[workspace]
resolver = "3"
members = ["crates/dwhy-core", "crates/dwhy-cli", "crates/dwhy-tui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
publish = false

[workspace.dependencies]
dwhy-core = { path = "crates/dwhy-core" }
dwhy-tui = { path = "crates/dwhy-tui" }
clap = { version = "4.6", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
unicode-width = "0.2"
rayon = "1.12"
rustix = { version = "1.1", features = ["fs", "process", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
insta = { version = "1.49", features = ["json", "redactions"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
