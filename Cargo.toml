[workspace]
resolver = "3"
members = ["crates/dwhy-core", "crates/dwhy-cli", "crates/dwhy-tui"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
publish = false
repository = "https://github.com/SaltedTan/diskwhy"
homepage = "https://github.com/SaltedTan/diskwhy"
readme = "README.md"
keywords = ["disk", "cleanup", "du", "tui", "linux"]
categories = ["command-line-utilities", "filesystem"]

[workspace.dependencies]
dwhy-core = { version = "0.0.1", path = "crates/dwhy-core" }
dwhy-tui = { version = "0.0.1", path = "crates/dwhy-tui" }
clap = { version = "4.6", features = ["derive"] }
# use-dev-tty: the default (mio) event source spins forever on EOF once the
# terminal hangs up, so event::poll never returns and dwhy can't exit.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
signal-hook = { version = "0.4", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm_0_29", "layout-cache"] }
unicode-segmentation = "1.13"
unicode-width = "0.2"
rayon = "1.12"
rustix = { version = "1.1", features = ["fs", "process", "system"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing"] }
insta = { version = "1.49", features = ["json", "redactions"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
